# LSSPP占卜系统Spring Boot版配置文件
server:
  port: 8082
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: lsspp-spring-boot

  # 环境配置
  profiles:
    active: default

  # 禁用favicon.ico请求
  mvc:
    favicon:
      enabled: false

  # 缓存配置 - 使用内存缓存
  cache:
    type: simple

  # JSON配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# 占卜算法配置
lsspp:
  divination:
    # 八字算法配置
    bazi:
      enabled: true
      cache-enabled: true
      cache-ttl: 86400
      lunar-calendar-enabled: true

    # 六爻算法配置
    liuyao:
      enabled: true
      cache-enabled: true
      cache-ttl: 86400
      methods:
        time: true
        number: true
        coin: true
        manual: true

    # 紫微斗数配置
    ziwei:
      enabled: true
      cache-enabled: true
      cache-ttl: 86400

# 日志配置
logging:
  level:
    com.lsspp: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      cors:
        allowed-origins: "*"
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always

# Swagger配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    try-it-out-enabled: true