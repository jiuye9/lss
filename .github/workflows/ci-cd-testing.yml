name: LSSPP占卜系统CI/CD测试流水线

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨2点运行完整测试套件
    - cron: '0 2 * * *'

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  MAVEN_OPTS: '-Xmx3072m'

jobs:
  # 代码质量检查
  code-quality:
    name: 🔍 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于SonarQube分析

      - name: ☕ 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📦 缓存Maven依赖
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🔍 代码风格检查
        run: |
          cd backend/lsspp-backend
          mvn checkstyle:check

      - name: 📊 代码复杂度分析
        run: |
          cd backend/lsspp-backend
          mvn spotbugs:check

  # 后端测试
  backend-tests:
    name: 🧪 后端测试
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: lsspp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📦 缓存Maven依赖
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🧪 运行单元测试
        run: |
          cd backend/lsspp-backend
          mvn clean test -Dspring.profiles.active=test

      - name: 🔄 运行集成测试
        run: |
          cd backend/lsspp-backend
          mvn failsafe:integration-test failsafe:verify

      - name: 📊 生成代码覆盖率报告
        run: |
          cd backend/lsspp-backend
          mvn jacoco:report

      - name: 📈 上传覆盖率到Codecov
        uses: codecov/codecov-action@v3
        with:
          file: backend/lsspp-backend/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage

      - name: 📋 生成Allure报告
        run: |
          cd backend/lsspp-backend
          mvn allure:report

      - name: 📤 上传测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/lsspp-backend/target/allure-report/
            backend/lsspp-backend/target/site/jacoco/
          retention-days: 30

  # 前端测试
  frontend-tests:
    name: 🎨 前端测试
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🌐 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/lsspp-frontend/package-lock.json

      - name: 📦 安装依赖
        run: |
          cd frontend/lsspp-frontend
          npm ci

      - name: 🎨 代码风格检查
        run: |
          cd frontend/lsspp-frontend
          npm run lint

      - name: 🧪 运行单元测试
        run: |
          cd frontend/lsspp-frontend
          npm run test:unit:coverage

      - name: 📈 上传前端覆盖率
        uses: codecov/codecov-action@v3
        with:
          file: frontend/lsspp-frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

      - name: 📤 上传前端测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: frontend-test-reports
          path: frontend/lsspp-frontend/coverage/
          retention-days: 30

  # API测试
  api-tests:
    name: 🔌 API测试
    runs-on: ubuntu-latest
    needs: [backend-tests]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: lsspp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📦 缓存Maven依赖
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🚀 启动应用
        run: |
          cd backend/lsspp-backend
          mvn spring-boot:run -Dspring.profiles.active=test &
          sleep 30  # 等待应用启动

      - name: 🔌 运行API测试
        run: |
          cd backend/lsspp-backend
          mvn test -Dtest=ApiTestFramework

      - name: 📤 上传API测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: api-test-reports
          path: backend/lsspp-backend/target/allure-results/
          retention-days: 30

  # E2E测试
  e2e-tests:
    name: 🔄 端到端测试
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: lsspp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🌐 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/lsspp-frontend/package-lock.json

      - name: 📦 缓存Maven依赖
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🚀 启动后端服务
        run: |
          cd backend/lsspp-backend
          mvn spring-boot:run -Dspring.profiles.active=test &
          sleep 30

      - name: 📦 安装前端依赖
        run: |
          cd frontend/lsspp-frontend
          npm ci

      - name: 🏗️ 构建前端应用
        run: |
          cd frontend/lsspp-frontend
          npm run build

      - name: 🌐 启动前端服务
        run: |
          cd frontend/lsspp-frontend
          npm run preview &
          sleep 10

      - name: 🔄 运行Cypress E2E测试
        run: |
          cd frontend/lsspp-frontend
          npm run test:e2e

      - name: 📤 上传E2E测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-reports
          path: |
            frontend/lsspp-frontend/cypress/reports/
            frontend/lsspp-frontend/cypress/screenshots/
            frontend/lsspp-frontend/cypress/videos/
          retention-days: 30

  # 安全测试
  security-tests:
    name: 🔒 安全测试
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📦 缓存Maven依赖
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🔒 运行安全测试
        run: |
          cd backend/lsspp-backend
          mvn test -Dtest=SecurityTest

      - name: 🛡️ OWASP依赖检查
        run: |
          cd backend/lsspp-backend
          mvn org.owasp:dependency-check-maven:check

      - name: 📤 上传安全测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-test-reports
          path: |
            backend/lsspp-backend/target/dependency-check-report.html
            backend/lsspp-backend/target/allure-results/
          retention-days: 30

  # 性能测试
  performance-tests:
    name: ⚡ 性能测试
    runs-on: ubuntu-latest
    needs: [api-tests]
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf-test]')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: lsspp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 设置Java环境
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📦 安装JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.5.tgz
          tar -xzf apache-jmeter-5.5.tgz
          echo "$PWD/apache-jmeter-5.5/bin" >> $GITHUB_PATH

      - name: 🚀 启动应用
        run: |
          cd backend/lsspp-backend
          mvn spring-boot:run -Dspring.profiles.active=test &
          sleep 45

      - name: ⚡ 运行性能测试
        run: |
          jmeter -n -t performance-test-plan.jmx \
                  -l results/performance-results.jtl \
                  -e -o performance-report \
                  -JUSERS=50 \
                  -JRAMP_TIME=30 \
                  -JDURATION=120

      - name: 📤 上传性能测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-test-reports
          path: performance-report/
          retention-days: 30

  # 综合报告生成
  generate-reports:
    name: 📊 生成综合报告
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, api-tests, e2e-tests, security-tests]
    if: always()

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📥 下载所有测试报告
        uses: actions/download-artifact@v3
        with:
          path: test-reports/

      - name: 📊 生成综合报告
        run: |
          # 这里可以添加自定义的报告聚合逻辑
          echo "生成综合测试报告..."
          ls -la test-reports/

      - name: 📤 发布测试报告到GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: test-reports/
          destination_dir: test-reports/${{ github.run_number }}

  # 质量门检查
  quality-gate:
    name: 🎯 质量门检查
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-tests]
    if: always()

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🎯 检查测试结果
        run: |
          echo "检查质量指标..."

          # 这里可以添加质量门逻辑
          # 例如：检查覆盖率是否达到85%
          # 检查安全测试是否通过
          # 检查性能指标是否满足要求

          echo "质量门检查通过 ✅"

      - name: 💬 通知测试结果
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#testing'
          text: |
            LSSPP占卜系统 CI/CD 测试流水线执行${{ job.status == 'success' && '成功' || '失败' }}

            📊 测试覆盖情况:
            - 后端测试: ${{ needs.backend-tests.result }}
            - 前端测试: ${{ needs.frontend-tests.result }}
            - API测试: ${{ needs.api-tests.result }}
            - E2E测试: ${{ needs.e2e-tests.result }}
            - 安全测试: ${{ needs.security-tests.result }}

            🔗 详细报告: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 自动化部署（仅在main分支且所有测试通过时）
  deploy:
    name: 🚀 自动化部署
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success'
    environment: production

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🚀 部署到生产环境
        run: |
          echo "部署到生产环境..."
          # 这里添加具体的部署逻辑

      - name: 🔍 部署后验证
        run: |
          echo "验证部署结果..."
          # 添加部署验证逻辑

      - name: 💬 部署成功通知
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployment'
          text: |
            🎉 LSSPP占卜系统已成功部署到生产环境！

            📋 部署信息:
            - 版本: ${{ github.sha }}
            - 分支: ${{ github.ref }}
            - 部署时间: ${{ github.event.head_commit.timestamp }}

            🔗 生产环境: https://lsspp.com
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}